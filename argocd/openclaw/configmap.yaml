apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
    component: config
data:
  openclaw.json: |
    {
      "gateway": {
        "bind": "0.0.0.0",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "allowedOrigins": [
            "https://ai.kamos.freeddns.org"
          ]
        }
      }
    }
  openclaw-local.json: |
    {
      "gateway": {
        "bind": "0.0.0.0",
        "port": 18800,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "allowedOrigins": [
            "https://ai.kamos.freeddns.org"
          ]
        }
      },
      "models": {
        "providers": {
          "ollama": {
            "baseUrl": "http://ollama:11434",
            "api": "ollama",
            "apiKey": "ollama-local",
            "models": [
              {
                "id": "llama3.2:3b",
                "name": "Llama 3.2 3B"
              },
              {
                "id": "gemma3:1b",
                "name": "Gemma 3 1B"
              }
            ]
          }
        }
      }
    }
