apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail-fem
  namespace: sail-fem
  labels:
    app: sail-fem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sail-fem
  template:
    metadata:
      labels:
        app: sail-fem
    spec:
      containers:
      - name: sail-fem
        image: ghcr.io/yayg/sailfem.website:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sail-fem
  namespace: sail-fem
  labels:
    app: sail-fem
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: sail-fem
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sail-fem
  namespace: sail-fem
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/redirect-entry-point: https
spec:
  ingressClassName: traefik
  tls:
    - secretName: sail-fem-tls
      hosts:
        - sail-fem.kamos.freeddns.org
  rules:
  - host: sail-fem.kamos.freeddns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sail-fem
            port:
              number: 80
