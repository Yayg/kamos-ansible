apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail-fem
  namespace: sail-fem
  labels:
    app: sail-fem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sail-fem
  template:
    metadata:
      labels:
        app: sail-fem
    spec:
      containers:
      - name: sail-fem
        image: ghcr.io/yayg/sailfem.website@sha256:b3429dad25e61ebd9d4f68417a897976c893e8c8c569997c79697956cae56330
        ports:
        - containerPort: 3000
        env:
        - name: POSTGRES_HOST
          value: sail-fem-postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: sail-fem-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sail-fem-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: sail-fem-secrets
              key: postgres-db
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: sail-fem-secrets
              key: auth-secret
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sail-fem
  namespace: sail-fem
  labels:
    app: sail-fem
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: sail-fem
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sail-fem
  namespace: sail-fem
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/redirect-entry-point: https
spec:
  ingressClassName: traefik
  tls:
    - secretName: sail-fem-tls
      hosts:
        - sail-fem.kamos.freeddns.org
  rules:
  - host: sail-fem.kamos.freeddns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sail-fem
            port:
              number: 80
