--- 
- name: Check if cluster-secrets KV engine exists
  shell: |
    kubectl exec -n vault vault-0 -- vault login $(kubectl get secret vault-root-token -n vault -o jsonpath="{.data.token}" | base64 --decode) > /dev/null
    kubectl exec -n vault vault-0 -- vault secrets list -format=json | jq -e '.["cluster-secrets/"]' > /dev/null
  environment:
    KUBECONFIG: /home/k8s/.kube/config
  register: cluster_secrets_exists
  ignore_errors: yes

- name: Enable cluster-secrets KV engine in Vault
  shell: |
    kubectl exec -n vault vault-0 -- vault login $(kubectl get secret vault-root-token -n vault -o jsonpath="{.data.token}" | base64 --decode) > /dev/null
    kubectl exec -n vault vault-0 -- vault secrets enable -path=cluster-secrets kv-v2
  environment:
    KUBECONFIG: /home/k8s/.kube/config
  when: cluster_secrets_exists is failed

- name: Create Vault Policy file for External Secrets
  copy:
    dest: /tmp/external-secrets-policy.hcl
    content: |
      path "cluster-secrets/*" {
        capabilities = ["read"]
      }
      path "auth/token/create" {
        capabilities = ["create", "update"]
      }

- name: Copy Vault Policy file to vault-0 pod
  shell: |
    kubectl cp /tmp/external-secrets-policy.hcl vault/vault-0:/tmp/external-secrets-policy.hcl --kubeconfig /home/k8s/.kube/config
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Write Vault Policy for External Secrets
  shell: |
    kubectl exec -n vault vault-0 -- vault policy write external-secrets /tmp/external-secrets-policy.hcl
  environment:
    KUBECONFIG: /home/k8s/.kube/config

# Install External Secrets Operator
- name: Add External Secrets Helm repository
  shell: |
    helm repo add external-secrets https://charts.external-secrets.io
    helm repo update
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Install External Secrets Operator with Helm
  community.kubernetes.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    namespace: external-secrets
    create_namespace: yes
    state: present
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Wait for External Secrets Operator to be ready
  shell: |
    kubectl wait --namespace external-secrets \
      --for=condition=available deployment \
      --timeout=600s external-secrets
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Create ClusterSecretStore for Vault
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: vault-secret-store
    spec:
      provider:
        vault:
          server: "http://vault.vault.svc.cluster.local:8200"
          path: "cluster-secrets/"
          version: "v2"
          auth:
            tokenSecretRef:
              name: vault-token
              namespace: default
              key: token
    EOF
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Generate Vault Token for External Secrets
  shell: |
    VAULT_ROOT_TOKEN=$(kubectl get secret vault-root-token -n vault -o jsonpath="{.data.token}" | base64 --decode)
    VAULT_TOKEN=$(kubectl exec -n vault vault-0 -- env VAULT_TOKEN="$VAULT_ROOT_TOKEN" vault token create -policy=external-secrets -ttl=24h -field=token)
    for namespace in {{ external_secrets_vault_token_namespaces | unique | join(' ') }}; do
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic vault-token \
        --from-literal=token="$VAULT_TOKEN" \
        --namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
    done
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Create RBAC for Vault Token Refresh CronJob
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: refresh-vault-token
      namespace: default
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: refresh-vault-token
      namespace: default
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "create", "update", "patch"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: refresh-vault-token
      namespace: default
    subjects:
      - kind: ServiceAccount
        name: refresh-vault-token
        namespace: default
    roleRef:
      kind: Role
      name: refresh-vault-token
      apiGroup: rbac.authorization.k8s.io
    ---
    {% for namespace in external_secrets_vault_token_namespaces | unique | reject('equalto', 'default') %}
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: refresh-vault-token
      namespace: {{ namespace }}
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "create", "update", "patch"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: refresh-vault-token
      namespace: {{ namespace }}
    subjects:
      - kind: ServiceAccount
        name: refresh-vault-token
        namespace: default
    roleRef:
      kind: Role
      name: refresh-vault-token
      apiGroup: rbac.authorization.k8s.io
    ---
    {% endfor %}
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: refresh-vault-token
      namespace: vault
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        resourceNames: ["vault-0"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["pods/exec"]
        resourceNames: ["vault-0"]
        verbs: ["create"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: refresh-vault-token
      namespace: vault
    subjects:
      - kind: ServiceAccount
        name: refresh-vault-token
        namespace: default
    roleRef:
      kind: Role
      name: refresh-vault-token
      apiGroup: rbac.authorization.k8s.io
    EOF
  environment:
    KUBECONFIG: /home/k8s/.kube/config

- name: Create CronJob to Refresh Vault Token
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: refresh-vault-token
      namespace: default
    spec:
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid
      jobTemplate:
        spec:
          template:
            spec:
              serviceAccountName: refresh-vault-token
              containers:
              - name: refresh-token
                image: bitnami/kubectl:latest
                command:
                  - "/bin/sh"
                  - "-c"
                  - |
                    set -eu
                    CURRENT_TOKEN=$(kubectl get secret vault-token -n default -o jsonpath="{.data.token}" | base64 -d)
                    NEW_TOKEN=$(kubectl exec -n vault vault-0 -- env VAULT_TOKEN="$CURRENT_TOKEN" vault token create -policy=external-secrets -ttl=24h -field=token)
                    for namespace in {{ external_secrets_vault_token_namespaces | unique | join(' ') }}; do
                      kubectl create secret generic vault-token \
                        --from-literal=token="$NEW_TOKEN" \
                        --namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
                    done
              restartPolicy: OnFailure
    EOF
  environment:
    KUBECONFIG: /home/k8s/.kube/config
